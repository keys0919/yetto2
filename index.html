<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yetto">
  <meta name="theme-color" content="#0E6878">
  <title>Yetto</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 홈 -->
  <div id="screen-home" class="screen">
    <div class="safe-area">
      <div class="home-center">

        <div class="home-info">
          <div class="home-status-card">
            <div class="home-status-elapsed" id="home-elapsed">—</div>
            <div class="home-status-label">마지막 흡연 후 경과</div>
            <div class="home-status-compare" id="home-elapsed-compare"></div>
          </div>

          <div class="record-row">
            <div class="record-item">
              <span class="record-value" id="home-today-count">—</span>
              <span class="record-label">오늘 흡연</span>
            </div>
            <div class="record-divider"></div>
            <div class="record-item">
              <span class="record-value record-value--sm" id="home-last-gap">—</span>
              <span class="record-label">마지막 간격</span>
            </div>
            <div class="record-divider"></div>
            <div class="record-item">
              <span class="record-value record-value--sm" id="home-today-avg-gap">—</span>
              <span class="record-label">오늘 평균</span>
            </div>
          </div>
        </div>

        <div class="home-actions">
          <button class="urge-btn" id="btn-urge">피고 싶다</button>
          <div class="home-row-btns">
            <button class="text-btn" id="btn-immediate">대기없이 진행</button>
            <button class="text-btn" id="btn-quick-add">횟수만 추가</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 타이머 -->
  <div id="screen-timer" class="screen no-tab">
    <div class="safe-area timer-area">
      <div class="timer-display" id="timer-display">00:00</div>
      <div class="timer-gap" id="timer-gap"></div>
    </div>
    <div class="timer-bottom-bar">
      <button class="primary-btn" id="btn-done">완료</button>
    </div>
  </div>

  <!-- 결과 -->
  <div id="screen-result" class="screen no-tab">
    <div class="safe-area result-area">
      <div class="result-time" id="result-time">00:00</div>
      <div class="result-sub" id="result-sub"></div>
      <div class="result-actions">
        <button class="primary-btn" id="btn-retry">한 번 더</button>
        <button class="secondary-btn" id="btn-home">홈으로</button>
      </div>
    </div>
  </div>

  <!-- 기록 -->
  <div id="screen-stats" class="screen">
    <div class="safe-area stats-area">
      <div class="stats-header-row">
        <h1 class="stats-heading">기록</h1>
        <div class="stats-header-actions">
          <button class="icon-btn" id="btn-import-trigger" title="가져오기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
          <button class="icon-btn" id="btn-export" title="내보내기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </button>
          <input type="file" id="input-import" accept=".json" style="display:none">
        </div>
      </div>

      <div class="section-label">오늘</div>

      <div class="stats-hero-card">
        <span class="stat-hero-label">오늘 흡연</span>
        <span class="stat-hero-value" id="stats-today-count">—</span>
      </div>

      <div class="stats-sub-grid">
        <div class="stat-card">
          <span class="stat-card-label">마지막 간격</span>
          <span class="stat-card-value stat-card-value--sm" id="stats-last-gap">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-card-label">오늘 평균</span>
          <span class="stat-card-value stat-card-value--sm" id="stats-today-avg-gap">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-card-label">주간 평균</span>
          <span class="stat-card-value stat-card-value--sm" id="stats-week-avg-gap">—</span>
        </div>
      </div>

      <div class="section-label">기간 비교</div>

      <div class="avg-card">
        <div class="avg-card-header">
          <span class="avg-card-title">평균 비교</span>
          <div class="avg-judge" id="avg-judge-count"></div>
          <div class="avg-judge" id="avg-judge-gap"></div>
        </div>
        <div class="avg-card-grid">
          <div class="avg-item">
            <span class="avg-label">주간 흡연 (일평균)</span>
            <span class="avg-value" id="stats-week-avg-count">—</span>
          </div>
          <div class="avg-item">
            <span class="avg-label">월간 흡연 (일평균)</span>
            <span class="avg-value" id="stats-month-avg-count">—</span>
          </div>
          <div class="avg-item">
            <span class="avg-label">주간 평균 홀딩</span>
            <span class="avg-value" id="stats-week-avg-hold">—</span>
          </div>
          <div class="avg-item">
            <span class="avg-label">월간 평균 홀딩</span>
            <span class="avg-value" id="stats-month-avg-hold">—</span>
          </div>
        </div>
      </div>

      <div class="section-label">일별 기록</div>

      <div class="daylog-wrap">
        <div class="daylog-header">
          <button class="cal-nav" id="day-prev">‹</button>
          <div class="daylog-title">
            <span class="daylog-label" id="day-label"></span>
            <span class="daylog-count" id="day-count"></span>
          </div>
          <button class="cal-nav" id="day-next">›</button>
        </div>
        <div class="daylog-list" id="daylog-list"></div>
      </div>

    </div>
  </div>

  <!-- 탭 바 -->
  <nav class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-screen="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      <span class="tab-label">홈</span>
    </button>
    <button class="tab-btn" data-screen="stats">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span class="tab-label">기록</span>
    </button>
  </nav>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
